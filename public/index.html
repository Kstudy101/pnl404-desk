<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PNL404</title>
  <meta name="description" content="미국·한국·일본 주식과 암호화폐 전광판 · 관심종목 · 피보나치 · SOP">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230B0E14'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-size='11' font-family='system-ui' fill='%2386EFAC'%3E404%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0B0E14;
      --bar: #11151c;
      --line: #262b36;
      --text: #e8edf4;
      --muted: #8891a0;
      --on: #86efac;
      --on-bg: #14532d;
    }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, Segoe UI, Malgun Gothic, sans-serif; }
    #app { height: 100%; display: flex; flex-direction: column; }
    header {
      flex: none;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 12px;
      height: 44px;
      background: var(--bar);
      border-bottom: 1px solid var(--line);
    }
    .brand { font-weight: 700; letter-spacing: 0.14em; font-size: 12px; color: var(--text); text-decoration: none; }
    .brand span { color: var(--on); }
    nav { display: flex; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; }
    nav button {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font: inherit;
      white-space: nowrap;
    }
    nav button:hover { color: var(--text); background: #1a2029; }
    nav button[aria-selected="true"] {
      color: var(--on);
      background: var(--on-bg);
      border-color: #166534;
    }
    .note { color: var(--muted); font-size: 11px; white-space: nowrap; }
    iframe { flex: 1; min-height: 0; width: 100%; border: 0; background: var(--bg); }
    @media (max-width: 720px) {
      .note { display: none; }
      header { gap: 10px; padding: 0 8px; }
      nav button { padding: 6px 8px; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <a class="brand" href="/">PNL<span>404</span></a>
      <nav role="tablist" aria-label="모듈">
        <button type="button" role="tab" id="tab-board" aria-controls="frame" aria-selected="true" data-tab="board">전광판</button>
        <button type="button" role="tab" id="tab-fib" aria-controls="frame" aria-selected="false" data-tab="fib">피보나치</button>
        <button type="button" role="tab" id="tab-sop" aria-controls="frame" aria-selected="false" data-tab="sop">SOP</button>
      </nav>
      <span class="note" id="note">미국 · 한국 · 일본 · 암호화폐</span>
    </header>
    <iframe id="frame" title="모듈" src="/modules/board/index.html"></iframe>
  </div>
  <script>
    const TABS = {
      board: { src: "/modules/board/index.html", title: "전광판 — PNL404", note: "미국 · 한국 · 일본 · 암호화폐 | 15분 갱신 확인" },
      fib: { src: "/modules/fib/index.html", title: "피보나치 — PNL404", note: "BTCUSDT 1~90일 기준 구간" },
      sop: { src: "/modules/sop/index.html", title: "SOP — PNL404", note: "BTC/ETH/SOL/XRP 1H 미해소 레벨" },
    };
    const frame = document.getElementById("frame");
    const note = document.getElementById("note");
    const buttons = [...document.querySelectorAll("nav [data-tab]")];

    function current() {
      const tab = new URLSearchParams(location.search).get("tab");
      return TABS[tab] ? tab : "board";
    }

    function apply(id, push) {
      const spec = TABS[id];
      if (!spec) return;
      if (push && current() === id) return;
      // A module change has one shell history entry. Replacing the child
      // navigation prevents Back from changing only the iframe under a stale tab.
      frame.contentWindow.location.replace(new URL(spec.src, location.href).href);
      frame.title = spec.title;
      document.title = spec.title;
      note.textContent = spec.note;
      for (const btn of buttons) {
        const on = btn.dataset.tab === id;
        btn.setAttribute("aria-selected", on ? "true" : "false");
      }
      const url = new URL(location.href);
      url.searchParams.set("tab", id);
      if (push) history.pushState({ tab: id }, "", url);
      else history.replaceState({ tab: id }, "", url);
    }

    for (const btn of buttons) {
      btn.addEventListener("click", () => apply(btn.dataset.tab, true));
    }
    window.addEventListener("popstate", () => apply(current(), false));
    apply(current(), false);
  </script>
</body>
</html>

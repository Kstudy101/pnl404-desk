name: Deploy pnl404.com

on:
  # Automatic publishing is owned by the hourly local pipeline. A code push
  # must not overwrite fresher operational snapshots with committed old data.
  workflow_dispatch:

concurrency:
  group: pnl404-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4.131.1'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d1058156eb886528d9b67d52a6de410a
          command: deploy
